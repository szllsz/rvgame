name: Verify published snapshot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify hashes, syntax and runtime manifests
        run: python3 -B verify_publication.py
      - name: Install offline reference dependencies
        run: python3 -m pip install -r requirements-host.txt
      - name: Recompute CPU, graphics, frame and audio results
        run: |
          python3 -B verification/recheck_metrics.py --output out/metrics.json
          python3 -B verification/recheck_final_visual.py --output out/games.json
      - name: Check portable artifact verification boundaries
        run: python3 -B skill/test_verify_artifacts.py --output out/skill
      - name: Exercise USB recovery boundaries without hardware
        run: python3 -B runtime/usb_priority/test_guard.py --output out/usb-priority
